apiVersion: batch/v1
kind: CronJob
metadata:
  name: rssimport
spec:
  schedule: "15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rssimport
              image: ghcr.io/somethingsoftware/rssimport:latest
              imagePullPolicy: Always
              resources:
                limits:
                  memory: "200Mi"
                  cpu: "200m"
              env:
              - name: APP_ENV
                value: "prod"
              - name: MIGRATION_FOLDER
                value: "/migrations"
              - name: VIEW_FOLDER
                value: "/views"
              - name: MAIN_HOST
                value: "cadencereader.com"
              - name: MAIN_HTTP_PORT
                value: "8080"
              - name: DRIPPER_HOST
                value: "dripper.cadencereader.com"
              - name: DRIPPER_HTTP_PORT
                value: "8081"
              - name: DATABASE_URL
                valueFrom:
                  secretKeyRef:
                    name: example-db-app
                    key: uri

          
